<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Orbit Globe - 3D UI Component</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    /* -------------------------------------------------------------
       GLOBAL RESET & ROOT VARIABLES
    ------------------------------------------------------------- */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
      -webkit-user-select: none;
    }

    :root {
      --bg-color: #0b0c10;
      --dot-color: rgba(255, 255, 255, 0.08);
      --card-w: 180px;
      --card-h: 220px;
      --card-radius: 26px;
      --globe-radius: 280px;
      --perspective: 1200px;
      --sidebar-w: 110px;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-color);
      /* Subtle dot grid pattern matching screenshot */
      background-image: radial-gradient(var(--dot-color) 1.25px, transparent 1.25px);
      background-size: 26px 26px;
      background-position: center center;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #ffffff;
      display: flex;
      position: relative;
    }

    /* -------------------------------------------------------------
       LEFT COMPONENT NAVIGATION SIDEBAR (Matching Screenshot)
    ------------------------------------------------------------- */
    .sidebar {
      width: var(--sidebar-w);
      height: 100vh;
      background: rgba(14, 15, 20, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 10px;
      gap: 14px;
      z-index: 50;
      position: relative;
    }

    .nav-item {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 6px;
      border-radius: 14px;
      text-decoration: none;
      color: #9094a0;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: -0.2px;
      gap: 8px;
      transition: all 0.2s ease;
      cursor: pointer;
      border: 1px solid transparent;
      background: transparent;
    }

    .nav-item:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.05);
    }

    .nav-item.active {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.16);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    }

    .nav-icon {
      width: 58px;
      height: 58px;
      border-radius: 12px;
      background: #191b22;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .nav-item.active .nav-icon {
      border-color: rgba(255, 255, 255, 0.3);
      background: #20232c;
    }

    /* -------------------------------------------------------------
       3D STAGE & SCENE
    ------------------------------------------------------------- */
    .viewport {
      flex: 1;
      height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: var(--perspective);
      perspective-origin: 50% 50%;
      cursor: grab;
      touch-action: none;
      overflow: hidden;
    }

    .viewport:active {
      cursor: grabbing;
    }

    /* 3D Orbit Center Origin */
    .globe-center {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
      will-change: transform;
    }

    /* -------------------------------------------------------------
       ORBIT GLOBE CARD SLOT & INNER
    ------------------------------------------------------------- */
    .card-slot {
      position: absolute;
      left: calc(var(--card-w) / -2);
      top: calc(var(--card-h) / -2);
      width: var(--card-w);
      height: var(--card-h);
      will-change: transform, z-index;
      cursor: pointer;
      transition: z-index 0.2s ease;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      border-radius: var(--card-radius);
      position: relative;
      overflow: hidden;
      background: #14151b;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 
        0 20px 45px -8px rgba(0, 0, 0, 0.85),
        0 0 1px 1px rgba(255, 255, 255, 0.08);
      transition: transform 0.25s cubic-bezier(0.2, 0.9, 0.3, 1), box-shadow 0.25s ease;
      filter: brightness(var(--card-brightness, 1));
      opacity: var(--card-opacity, 1);
    }

    .card-slot:hover {
      z-index: 9999 !important;
    }

    .card-slot:hover .card-inner {
      transform: scale(1.08) translateY(-6px);
      box-shadow: 
        0 30px 65px -6px rgba(0, 0, 0, 0.95),
        0 0 0 1px rgba(255, 255, 255, 0.35),
        0 0 25px rgba(255, 255, 255, 0.15);
    }

    .card-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      display: block;
    }

    .card-sheen {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0) 100%);
      pointer-events: none;
      border-top-left-radius: var(--card-radius);
      border-top-right-radius: var(--card-radius);
    }

    /* -------------------------------------------------------------
       EXACT SCREENSHOT CARD DESIGNS FOR ORBIT GLOBE
    ------------------------------------------------------------- */
    /* 1. "NATURAL FRESH" Featured Center Card */
    .style-natural-fresh {
      background-color: #1a1c20;
      display: flex;
      flex-direction: column;
      padding: 18px 16px;
      justify-content: space-between;
    }
    .style-natural-fresh .fresh-header h3 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #ffffff;
      line-height: 1.15;
    }
    .style-natural-fresh .thumbnail-row {
      display: flex;
      gap: 8px;
      margin-top: auto;
    }
    .style-natural-fresh .thumb {
      flex: 1;
      height: 48px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .style-natural-fresh .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 2. "2026 NOV" Olive Card */
    .style-nov-photo {
      background-color: #5c6650;
      padding: 10px;
      display: flex;
      flex-direction: column;
    }
    .style-nov-photo .nov-frame {
      width: 100%;
      height: 100%;
      position: relative;
      border-radius: 18px;
      overflow: hidden;
    }
    .style-nov-photo .nov-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .style-nov-photo .nov-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      background: rgba(0, 0, 0, 0.15);
    }
    .style-nov-photo .nov-overlay span {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.7);
    }

    /* 3. Center Man in Grass with Flower Graphic Mask */
    .center-flower-badge {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 76px;
      height: 76px;
      pointer-events: none;
      z-index: 5;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.6));
    }

    /* 4. "north ave" Olive Card */
    .style-olive {
      background-color: #5d674f;
      display: flex;
      flex-direction: column;
      padding: 12px;
    }
    .style-olive .photo-inset {
      width: 100%;
      height: 128px;
      background: #f2ede4;
      border-radius: 14px;
      padding: 6px;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08);
    }
    .style-olive .photo-inset img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 9px;
    }
    .style-olive .olive-footer {
      margin-top: auto;
      padding: 4px 6px;
      text-align: right;
    }
    .style-olive .olive-footer h3 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: #edebe4;
      letter-spacing: -0.4px;
    }

    /* 5. "Maple Street" Cream Card */
    .style-cream {
      background-color: #ede8dc;
      color: #1e1f1c;
      padding: 15px;
      display: flex;
      flex-direction: column;
    }
    .style-cream .circle-inset {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      overflow: hidden;
      margin-bottom: 10px;
      border: 2px solid rgba(0,0,0,0.06);
    }
    .style-cream .circle-inset img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .style-cream .cream-text {
      font-size: 11.5px;
      font-weight: 700;
      line-height: 1.35;
      color: #242422;
      max-width: 130px;
    }
    .style-cream .cream-dash {
      font-size: 18px;
      margin-top: auto;
      font-weight: 800;
      color: #333;
    }

    /* 6. "THU / 0316 AVE" Poppy Field Card */
    .card-overlay-text {
      position: absolute;
      inset: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
      z-index: 2;
    }
    .card-badge {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 2px 8px rgba(0,0,0,0.7);
    }
    .card-title-lg {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 22px;
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.5px;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 3px 12px rgba(0,0,0,0.8);
    }
    .card-gradient-scrim {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, transparent 40%, rgba(0,0,0,0.65) 100%);
      pointer-events: none;
    }

    /* 7. "0034 - 0095" Split Card */
    .style-sage-split {
      background-color: #dce3d5;
      color: #222520;
      position: relative;
    }
    .style-sage-split .left-image-half {
      position: absolute;
      top: 0;
      left: 0;
      width: 62%;
      height: 100%;
      object-fit: cover;
      mask-image: linear-gradient(to right, rgba(0,0,0,1) 75%, rgba(0,0,0,0) 100%);
      -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,1) 75%, rgba(0,0,0,0) 100%);
    }
    .style-sage-split .right-numbers {
      position: absolute;
      right: 14px;
      top: 18px;
      bottom: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-end;
      font-family: 'Space Grotesk', monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #1a1e17;
    }

    /* -------------------------------------------------------------
       BOTTOM "KEYFRAMES ^" PILL & CONTROL PANEL
    ------------------------------------------------------------- */
    .ui-layer {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .keyframes-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 20px 9px 22px;
      background: rgba(22, 23, 29, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 9999px;
      color: #eaecef;
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: -0.2px;
      cursor: pointer;
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.65), 0 0 1px 1px rgba(255,255,255,0.06);
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .keyframes-pill:hover {
      background: rgba(30, 32, 40, 0.98);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
      box-shadow: 0 14px 35px -5px rgba(0, 0, 0, 0.75);
    }

    .keyframes-pill .icon-caret {
      transition: transform 0.3s ease;
      display: flex;
      align-items: center;
    }

    .keyframes-pill.active .icon-caret {
      transform: rotate(180deg);
    }

    /* Controls Panel */
    .controls-panel {
      position: absolute;
      bottom: 66px;
      left: 50%;
      transform: translateX(-50%) translateY(20px) scale(0.96);
      width: 440px;
      max-width: calc(100vw - 32px);
      background: rgba(18, 19, 25, 0.95);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 25px 60px -10px rgba(0, 0, 0, 0.88);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 99;
    }

    .controls-panel.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0) scale(1);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .panel-header h4 {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel-header h4 span {
      font-size: 11px;
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 7px;
      border-radius: 6px;
      color: #aaa;
      font-weight: 500;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 12.5px;
      color: #c0c4ce;
    }

    .control-row input[type="range"] {
      width: 170px;
      accent-color: #ffffff;
      height: 4px;
      cursor: pointer;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .btn {
      flex: 1;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.06);
      color: #eee;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .btn.primary {
      background: #ffffff;
      color: #0b0c10;
      border-color: #ffffff;
    }

    .btn.primary:hover {
      background: #e4e6ea;
    }

    .image-manager {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .image-manager textarea {
      width: 100%;
      height: 64px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 8px 10px;
      color: #eee;
      font-family: monospace;
      font-size: 11px;
      resize: vertical;
      margin-top: 6px;
      outline: none;
    }

    .hint-text {
      font-size: 10.5px;
      color: #7b808d;
      margin-top: 4px;
      line-height: 1.3;
    }

    .top-hint {
      position: absolute;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.35);
      letter-spacing: 0.5px;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    @media (max-width: 768px) {
      .sidebar {
        display: none;
      }
      :root {
        --card-w: 150px;
        --card-h: 185px;
        --card-radius: 20px;
        --globe-radius: 220px;
      }
    }
  </style>
</head>

    <!-- 5. Card Tunnel -->
    <a href="card-tunnel.html" class="nav-item" title="Card Tunnel">
      <div class="nav-icon">

    // =========================================================================

    const GLOBE_TEMPLATES = [
      {

    // =========================================================================
    // STATE & CONFIGURATION
    // =========================================================================
    let currentImages = [...IMAGES];
    let isEditorialMode = true;
    let autoRotateSpeed = 0.22;
    let isAutoRotating = true;
    let globeRadius = 280;

    // Viewport rotations (Euler angles)
    let rotX = -8;
    let rotY = 0;
    let targetRotX = -8;
    let targetRotY = 0;
    let velX = 0;
    let velY = 0;
    let isDragging = false;
    let lastX = 0;
    let lastY = 0;
    let lastTime = 0;

    // Multi-tier 3D Orbit Coordinates (Fibonacci sphere distribution)
    // 14 carefully calculated nodes forming an aesthetic 3D globe cluster
    const ORBIT_NODES = [
      { lat: 0,   lon: 0,   zBias: 35 },   // Center Focal Front
      { lat: 24,  lon: 50,  zBias: 15 },   // Top Right Front
      { lat: -8,  lon: 65,  zBias: 10 },   // Middle Right Front
      { lat: -28, lon: 35,  zBias: 20 },   // Bottom Right Front
      { lat: -26, lon: -35, zBias: 20 },   // Bottom Left Front
      { lat: 0,   lon: -60, zBias: 10 },   // Middle Left Front
      { lat: 26,  lon: -45, zBias: 15 },   // Top Left Front
      { lat: 46,  lon: 10,  zBias: 5 },    // Top Center
      { lat: -48, lon: -10, zBias: 5 },    // Bottom Center
      { lat: 30,  lon: 140, zBias: -20 },  // Back Top Right
      { lat: -15, lon: 160, zBias: -30 },  // Back Mid Right
      { lat: -35, lon: -140, zBias: -25 }, // Back Bottom Left
      { lat: 10,  lon: -150, zBias: -30 }, // Back Mid Left
      { lat: 45,  lon: -110, zBias: -20 }  // Back Top Left
    ];

    // DOM Elements
    const viewport = document.getElementById('viewport');
    const globeCenter = document.getElementById('globeCenter');
    const keyframesToggle = document.getElementById('keyframesToggle');
    const controlsPanel = document.getElementById('controlsPanel');
    const closePanelBtn = document.getElementById('closePanelBtn');
    const speedSlider = document.getElementById('speedSlider');
    const radiusSlider = document.getElementById('radiusSlider');
    const wobbleSlider = document.getElementById('wobbleSlider');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const resetViewBtn = document.getElementById('resetViewBtn');
    const toggleStyleBtn = document.getElementById('toggleStyleBtn');
    const imageInputArea = document.getElementById('imageInputArea');
    const applyImagesBtn = document.getElementById('applyImagesBtn');
    const presetMatchBtn = document.getElementById('presetMatchBtn');
    const cardCountLabel = document.getElementById('cardCountLabel');

    let cardSlots = [];

    // =========================================================================
    // BUILD 3D ORBIT GLOBE
    // =========================================================================
    function buildGlobe() {
      globeCenter.innerHTML = '';
      cardSlots = [];

      const count = ORBIT_NODES.length;
      cardCountLabel.textContent = `${count} cards`;
      imageInputArea.value = currentImages.join('\n');

      ORBIT_NODES.forEach((node, i) => {
        const slot = document.createElement('div');
        slot.className = 'card-slot';
        slot.dataset.lat = node.lat;
        slot.dataset.lon = node.lon;
        slot.dataset.index = i;

        const inner = document.createElement('div');
        inner.className = 'card-inner';

        const template = GLOBE_TEMPLATES[i % GLOBE_TEMPLATES.length];
        const imageSrc = currentImages[i % currentImages.length];

        if (isEditorialMode) {
          renderEditorialCard(inner, template, imageSrc);
        } else {
          renderCleanCard(inner, imageSrc, i);
        }

        slot.appendChild(inner);

        // Click to bring card front and center
        slot.addEventListener('click', (e) => {
          if (Math.hypot(velX, velY) > 0.05) return;
          focusCard(node.lat, node.lon);
        });

        globeCenter.appendChild(slot);
        cardSlots.push({ slot, inner, lat: node.lat, lon: node.lon, zBias: node.zBias || 0 });
      });

      updateGlobeTransform();
      updateDepthShading();
    }

    // Render Editorial Card Design matching the screenshot
    function renderEditorialCard(container, template, src) {
      const actualSrc = src || template.image;

      if (template.type === 'natural-fresh') {

            <div class="thumb"><img src="${template.thumb2}" onerror="this.src='https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=300'" alt="t2"></div>
            <div class="thumb"><img src="${template.thumb3}" onerror="this.src='https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=300'" alt="t3"></div>
          </div>
          <div class="card-sheen"></div>
        `;
      }
      else if (template.type === 'nov-card') {
        container.className = 'card-inner style-nov-photo';
        container.innerHTML = `
          <div class="nov-frame">
            <img src="${actualSrc}" onerror="this.src='https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=600'" alt="2026 NOV">
            <div class="nov-overlay">
              <span>${template.year}</span>
              <span>${template.month}</span>
            </div>
          </div>
          <div class="card-sheen"></div>
        `;
      }
      else if (template.type === 'center-man') {
        container.innerHTML = `
          <img class="card-img" src="${actualSrc}" onerror="this.src='https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=600'" alt="Center Portrait">
          <svg class="center-flower-badge" viewBox="0 0 100 100">
            <use href="#flower-mask-icon" />
          </svg>
          <div class="card-sheen"></div>
        `;
      }
      else if (template.type === 'north-ave') {
        container.className = 'card-inner style-olive';
        container.innerHTML = `
          <div class="photo-inset">
            <img src="${actualSrc}" onerror="this.src='https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=600'" alt="Meadow flowers">
          </div>
          <div class="olive-footer">
            <h3>${template.title}</h3>
          </div>
          <div class="card-sheen"></div>
        `;
      }
      else if (template.type === 'maple-st') {
        container.className = 'card-inner style-cream';
        container.innerHTML = `
          <div class="circle-inset">
            <img src="${actualSrc}" onerror="this.src='https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=600'" alt="Circle photo">
          </div>
          <div class="cream-text">${template.text}</div>
          <div class="cream-dash">-</div>
          <div class="card-sheen"></div>
        `;
      }
      else if (template.type === 'sage-split') {
        container.className = 'card-inner style-sage-split';
        container.innerHTML = `
          <img class="left-image-half" src="${actualSrc}" onerror="this.src='https://images.unsplash.com/photo-1526047932273-341f2a7631f9?w=600'" alt="Blossom macro">
          <div class="right-numbers">
            <span>${template.numTop}</span>
            <span>-</span>
            <span>${template.numBottom}</span>
          </div>
          <div class="card-sheen"></div>
        `;
      }
      else {
        // High-end photo with gradient overlay and typography
        container.innerHTML = `
          <img class="card-img" src="${actualSrc}" onerror="this.src='https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=600'" alt="Photo">
          <div class="card-gradient-scrim"></div>
          <div class="card-overlay-text">
            ${template.badge ? `<div class="card-badge">${template.badge}</div>` : '<div></div>'}
            <div class="card-title-lg">${template.title || ''}</div>

    // Clean Full Photo Mode
    function renderCleanCard(container, src, index) {
      container.className = 'card-inner';
      container.innerHTML = `
        <img class="card-img" src="${src}" onerror="this.src='https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=600'" alt="Photo ${index + 1}">
        <div class="card-sheen"></div>
      `;
    }

    // =========================================================================
    // 3D ORBIT PROJECTION & DYNAMIC Z-INDEX SORTING
    // =========================================================================
    function updateGlobeTransform() {
      const radY = (rotY * Math.PI) / 180;
      const radX = (rotX * Math.PI) / 180;
      const maxR = globeRadius + 50;

      cardSlots.forEach(({ slot, inner, lat, lon, zBias }) => {
        // 1. Initial position on sphere
        const r = globeRadius + (zBias || 0);
        const rLat = (lat * Math.PI) / 180;
        const rLon = (lon * Math.PI) / 180;

        let x0 = r * Math.cos(rLat) * Math.sin(rLon);
        let y0 = -r * Math.sin(rLat);
        let z0 = r * Math.cos(rLat) * Math.cos(rLon);

        // 2. Rotate around Y (yaw)
        let x1 = x0 * Math.cos(radY) + z0 * Math.sin(radY);
        let z1 = -x0 * Math.sin(radY) + z0 * Math.cos(radY);
        let y1 = y0;

        // 3. Rotate around X (pitch)
        let y2 = y1 * Math.cos(radX) - z1 * Math.sin(radX);
        let z2 = y1 * Math.sin(radX) + z1 * Math.cos(radX);
        let x2 = x1;

        // Depth factor: 0 (far back) to 1 (front focal)
        const depth = Math.max(0, Math.min(1, (z2 + maxR) / (2 * maxR)));

        // Scale & depth appearance
        const scale = 0.85 + 0.18 * depth;
        const brightness = 0.42 + 0.58 * depth;
        const opacity = 0.65 + 0.35 * depth;

        // Dynamic z-index prevents 3D plane intersection slicing
        const zIndex = Math.round(z2 + 1000);

        slot.style.transform = `translate3d(${x2.toFixed(1)}px, ${y2.toFixed(1)}px, ${z2.toFixed(1)}px) scale(${scale.toFixed(3)})`;
        slot.style.zIndex = zIndex;

        inner.style.setProperty('--card-brightness', brightness.toFixed(3));
        inner.style.setProperty('--card-opacity', opacity.toFixed(3));
      });
    }

    function updateDepthShading() {
      // Handled directly inside updateGlobeTransform
    }

    // Focus chosen card to front
    function focusCard(lat, lon) {
      targetRotX = -lat;

      let diffY = (-lon - targetRotY) % 360;
      if (diffY > 180) diffY -= 360;
      if (diffY < -180) diffY += 360;

      targetRotY += diffY;
      velX = 0;
      velY = 0;
    }

    // =========================================================================
    // ANIMATION & PHYSICS LOOP
    // =========================================================================
    function animate() {
      if (!isDragging) {
        if (isAutoRotating) {
          targetRotY += autoRotateSpeed;
        }

        // Apply momentum inertia
        if (Math.abs(velX) > 0.001 || Math.abs(velY) > 0.001) {
          targetRotX += velX;
          targetRotY += velY;
          velX *= 0.94;
          velY *= 0.94;
        }

        // Clamp vertical pitch tilt
        targetRotX = Math.max(-45, Math.min(45, targetRotX));
      }

      // Smooth lerp easing
      rotX += (targetRotX - rotX) * 0.12;
      rotY += (targetRotY - rotY) * 0.12;

      updateGlobeTransform();
      updateDepthShading();

      requestAnimationFrame(animate);
    }

    // =========================================================================
    // 2-AXIS 3D DRAG GESTURES
    // =========================================================================
    viewport.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.controls-panel') || e.target.closest('.ui-layer') || e.target.closest('.sidebar')) return;

      isDragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
      lastTime = performance.now();
      velX = 0;
      velY = 0;
      viewport.setPointerCapture(e.pointerId);
    });

    viewport.addEventListener('pointermove', (e) => {
      if (!isDragging) return;

      const now = performance.now();
      const dt = Math.max(1, now - lastTime);
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;

      const sensitivity = 0.32;
      targetRotY += dx * sensitivity;
      targetRotX -= dy * sensitivity;

      targetRotX = Math.max(-45, Math.min(45, targetRotX));

      rotY = targetRotY;
      rotX = targetRotX;

      velY = (dx / dt) * 10;
      velX = -(dy / dt) * 10;

      lastX = e.clientX;
      lastY = e.clientY;
      lastTime = now;
      updateGlobeTransform();
    });

    function endDrag(e) {
      if (!isDragging) return;
      isDragging = false;
      try { viewport.releasePointerCapture(e.pointerId); } catch (_) {}
    }

    viewport.addEventListener('pointerup', endDrag);
    viewport.addEventListener('pointercancel', endDrag);

    // Mouse wheel rotation
    window.addEventListener('wheel', (e) => {
      if (e.target.closest('.controls-panel') || e.target.closest('.sidebar')) return;
      e.preventDefault();
      targetRotY -= Math.sign(e.deltaY) * 6;
    }, { passive: false });

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
      if (e.key === 'ArrowLeft') targetRotY -= 15;
      else if (e.key === 'ArrowRight') targetRotY += 15;
      else if (e.key === 'ArrowUp') targetRotX = Math.min(45, targetRotX + 10);
      else if (e.key === 'ArrowDown') targetRotX = Math.max(-45, targetRotX - 10);
      else if (e.key === ' ') {
        e.preventDefault();
        togglePlayPause();
      }
    });

    // =========================================================================
    // UI CONTROLS & "KEYFRAMES ^" TOGGLE
    // =========================================================================
    keyframesToggle.addEventListener('click', () => {
      const isOpen = controlsPanel.classList.toggle('open');
      keyframesToggle.classList.toggle('active', isOpen);
    });

    closePanelBtn.addEventListener('click', () => {
      controlsPanel.classList.remove('open');
      keyframesToggle.classList.remove('active');
    });

    function togglePlayPause() {
      isAutoRotating = !isAutoRotating;
      playPauseBtn.textContent = isAutoRotating ? '⏸ Pause' : '▶ Play';
      playPauseBtn.classList.toggle('primary', !isAutoRotating);
    }

    playPauseBtn.addEventListener('click', togglePlayPause);

    speedSlider.addEventListener('input', (e) => {
      autoRotateSpeed = parseFloat(e.target.value);
      if (!isAutoRotating && autoRotateSpeed !== 0) togglePlayPause();
    });

    radiusSlider.addEventListener('input', (e) => {
      globeRadius = parseInt(e.target.value, 10);
      cardSlots.forEach(({ slot, lat, lon, zBias }) => {
        const effectiveRadius = globeRadius + zBias;
        slot.style.transform = `rotateY(${lon}deg) rotateX(${lat}deg) translateZ(${effectiveRadius}px)`;
      });
    });

    wobbleSlider.addEventListener('input', (e) => {
      targetRotX = parseInt(e.target.value, 10);
    });

    resetViewBtn.addEventListener('click', () => {
      targetRotX = -8;
      targetRotY = 0;
      globeRadius = 280;
      radiusSlider.value = globeRadius;
      wobbleSlider.value = -8;
      buildGlobe();
    });

    toggleStyleBtn.addEventListener('click', () => {
      isEditorialMode = !isEditorialMode;
      toggleStyleBtn.textContent = isEditorialMode ? '🎨 Editorial Mode' : '🖼 Clean Photo Mode';
      buildGlobe();
    });

    applyImagesBtn.addEventListener('click', () => {
      const raw = imageInputArea.value.trim();
      if (!raw) return;
      const lines = raw.split(/[\n,]+/).map(s => s.trim()).filter(Boolean);
      if (lines.length > 0) {
        currentImages = lines;
        buildGlobe();
      }
    });

    presetMatchBtn.addEventListener('click', () => {
      currentImages = [...IMAGES];
      isEditorialMode = true;
      toggleStyleBtn.textContent = '🎨 Toggle Style';
      buildGlobe();
    });

    // Initialize
    buildGlobe();
    animate();
  </script>
</body>
</html>
